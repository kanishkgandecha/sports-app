name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sports
          POSTGRES_PASSWORD: sports
          POSTGRES_DB: sports_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sports -d sports_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://sports:sports@localhost:5432/sports_platform_test
      CORS_ORIGINS: http://localhost:3000
      F1_PROVIDER: disabled
      F1_STANDINGS_PROVIDER: disabled
      CRICKET_PROVIDER: disabled
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sports/db exec prisma migrate deploy
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec turbo run test --force
      - run: pnpm exec turbo run build --force
      - run: pnpm audit --prod --audit-level high

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - run: docker compose build
